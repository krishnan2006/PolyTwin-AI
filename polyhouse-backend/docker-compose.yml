services:
  db:
    image: timescale/timescaledb:latest-pg16

    container_name: polyhouse-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: polyhouse
      POSTGRES_USER: polyhouse
      POSTGRES_PASSWORD: polyhouse

    ports:
      - "5432:5432"

    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata: